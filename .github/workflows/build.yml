name: Build APK
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Persistent Signing Key (If not exists in repo)
        run: |
          if [ ! -f app/upscaler.jks ]; then
            keytool -genkey -v -keystore app/upscaler.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upscaler -storepass 123456 -keypass 123456 -dname "CN=Nho, OU=Dev, O=Nho, L=HCM, S=HCM, C=VN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/upscaler.jks
            git commit -m "Chore: Add persistent signing keystore for seamless APK updates"
            git push
          fi

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -P /tmp
          sudo unzip -q -d /opt/gradle /tmp/gradle-8.4-bin.zip
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Build Signed APK
        env:
          RUN_NUM: ${{ github.run_number }}
        run: gradle assembleDebug -PversionCode=$RUN_NUM --no-daemon --stacktrace

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "GameUpscaler v1.0.${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}