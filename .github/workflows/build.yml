name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (leave empty for auto v1.0.<run_number>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Persistent Signing Key (If not exists in repo)
        run: |
          if [ ! -f app/upscaler.jks ]; then
            keytool -genkey -v -keystore app/upscaler.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upscaler -storepass 123456 -keypass 123456 -dname "CN=Nho, OU=Dev, O=Nho, L=HCM, S=HCM, C=VN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/upscaler.jks
            git commit -m "Chore: Add persistent signing keystore for seamless APK updates"
            git push
          fi

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -P /tmp
          sudo unzip -q -d /opt/gradle /tmp/gradle-8.4-bin.zip
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Determine Release Eligibility & Version
        id: check_release
        run: |
          RUN_NUM="${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_release }}" == "true" ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            TAG="${{ inputs.release_tag }}"
            if [ -z "$TAG" ]; then
              TAG="v1.0.$RUN_NUM"
            fi
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
            TAG="v1.0.$RUN_NUM"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

          VER_NAME="${TAG#v}"
          IFS='.' read -r V_MAJ V_MIN V_PATCH <<< "$VER_NAME"
          V_MAJ=${V_MAJ//[^0-9]/}; V_MAJ=${V_MAJ:-1}
          V_MIN=${V_MIN//[^0-9]/}; V_MIN=${V_MIN:-0}
          V_PATCH=${V_PATCH//[^0-9]/}; V_PATCH=${V_PATCH:-$RUN_NUM}
          VER_CODE=$(( V_MAJ * 10000 + V_MIN * 100 + V_PATCH ))
          if [ "$VER_CODE" -lt "$RUN_NUM" ]; then
            VER_CODE="$RUN_NUM"
          fi
          echo "version_name=$VER_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VER_CODE" >> $GITHUB_OUTPUT

          # Extract annotated tag message (if any) so in-app OTA updater shows clean changelog
          TAG_MSG=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || true)
          {
            echo "tag_notes<<EOF_NOTES"
            echo "$TAG_MSG"
            echo "EOF_NOTES"
          } >> $GITHUB_OUTPUT

      - name: Build Signed APK
        run: gradle assembleRelease -PversionCode=${{ steps.check_release.outputs.version_code }} -PversionName=${{ steps.check_release.outputs.version_name }} --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameUpscaler-${{ steps.check_release.outputs.tag }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        if: steps.check_release.outputs.should_release == 'true'
        with:
          tag_name: ${{ steps.check_release.outputs.tag }}
          name: "GameUpscaler ${{ steps.check_release.outputs.tag }}"
          body: ${{ steps.check_release.outputs.tag_notes }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
