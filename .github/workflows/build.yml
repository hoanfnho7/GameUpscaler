name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (leave empty for auto v1.0.<run_number>)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Persistent Signing Key (If not exists in repo)
        run: |
          if [ ! -f app/upscaler.jks ]; then
            keytool -genkey -v -keystore app/upscaler.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upscaler -storepass 123456 -keypass 123456 -dname "CN=Nho, OU=Dev, O=Nho, L=HCM, S=HCM, C=VN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/upscaler.jks
            git commit -m "Chore: Add persistent signing keystore for seamless APK updates"
            git push
          fi

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -P /tmp
          sudo unzip -q -d /opt/gradle /tmp/gradle-8.4-bin.zip
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Build Signed APK
        env:
          RUN_NUM: ${{ github.run_number }}
        run: gradle assembleRelease -PversionCode=$RUN_NUM --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameUpscaler-v1.0.${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Determine Release Eligibility
        id: check_release
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_release }}" == "true" ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            TAG="${{ inputs.release_tag }}"
            if [ -z "$TAG" ]; then
              TAG="v1.0.${{ github.run_number }}"
            fi
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        if: steps.check_release.outputs.should_release == 'true'
        with:
          tag_name: ${{ steps.check_release.outputs.tag }}
          name: "GameUpscaler ${{ steps.check_release.outputs.tag }}"
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Old Releases & Action Runs
        if: steps.check_release.outputs.should_release == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = context.runId;
            const currentTag = '${{ steps.check_release.outputs.tag }}';

            // 1. Delete all old releases & tags except the newly published one
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            for (const rel of releases) {
              if (rel.tag_name === currentTag) continue;
              try {
                await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.id });
                console.log(`Deleted old release: ${rel.tag_name}`);
              } catch (e) { console.log(`Skip release ${rel.tag_name}: ${e.message}`); }
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${rel.tag_name}` });
                console.log(`Deleted old tag: ${rel.tag_name}`);
              } catch (e) { console.log(`Skip tag ${rel.tag_name}: ${e.message}`); }
            }

            // 2. Delete all completed workflow runs except the current run
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, per_page: 100 });
            for (const run of runs) {
              if (run.id === currentRunId || run.status !== 'completed') continue;
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                console.log(`Deleted old workflow run #${run.run_number} (${run.id})`);
              } catch (e) { console.log(`Skip run #${run.run_number}: ${e.message}`); }
            }
