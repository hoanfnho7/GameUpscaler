name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (leave empty for auto v1.0.<run_number>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Generate Persistent Signing Key (If not exists in repo)
        run: |
          if [ ! -f app/upscaler.jks ]; then
            keytool -genkey -v -keystore app/upscaler.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upscaler -storepass 123456 -keypass 123456 -dname "CN=Nho, OU=Dev, O=Nho, L=HCM, S=HCM, C=VN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/upscaler.jks
            git commit -m "Chore: Add persistent signing keystore for seamless APK updates"
            git push
          fi

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -P /tmp
          sudo unzip -q -d /opt/gradle /tmp/gradle-8.4-bin.zip
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Build Signed APK
        env:
          RUN_NUM: ${{ github.run_number }}
        run: gradle assembleRelease -PversionCode=$RUN_NUM --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameUpscaler-v1.0.${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk

      - name: Determine Release Eligibility
        id: check_release
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_release }}" == "true" ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            TAG="${{ inputs.release_tag }}"
            if [ -z "$TAG" ]; then
              TAG="v1.0.${{ github.run_number }}"
            fi
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        if: steps.check_release.outputs.should_release == 'true'
        with:
          tag_name: ${{ steps.check_release.outputs.tag }}
          name: "GameUpscaler ${{ steps.check_release.outputs.tag }}"
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
