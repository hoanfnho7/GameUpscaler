name: Clean Old Releases
on:
  workflow_dispatch:
    inputs:
      keep_count:
        description: 'Number of latest releases to keep (e.g. 1)'
        required: true
        default: '1'

permissions:
  contents: write
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Old Releases & Tags
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const keepCount = parseInt('${{ github.event.inputs.keep_count }}', 10) || 1;
            console.log(`Fetching all releases for ${context.repo.owner}/${context.repo.repo}...`);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            console.log(`Found ${releases.length} releases in total.`);
            
            // Sort releases descending by creation time (newest first)
            releases.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            
            const toDelete = releases.slice(keepCount);
            console.log(`Keeping ${Math.min(keepCount, releases.length)} latest release(s). Deleting ${toDelete.length} old release(s)...`);
            
            for (const rel of toDelete) {
              console.log(`Deleting release: ${rel.name || rel.tag_name} (${rel.tag_name}) [ID: ${rel.id}]`);
              try {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: rel.id
                });
                console.log(`Deleted release ${rel.id}`);
              } catch (e) {
                console.error(`Failed to delete release ${rel.id}:`, e.message);
              }
              
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${rel.tag_name}`
                });
                console.log(`Deleted tag ref: tags/${rel.tag_name}`);
              } catch (e) {
                console.error(`Could not delete tag ref ${rel.tag_name}:`, e.message);
              }
            }
            console.log('Cleanup completed successfully!');
