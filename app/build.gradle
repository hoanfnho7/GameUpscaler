plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nho.upscaler'
    compileSdk 34

    signingConfigs {
        fixedKey {
            storeFile file("upscaler.jks")
            storePassword "123456"
            keyAlias "upscaler"
            keyPassword "123456"
        }
    }

    defaultConfig {
        applicationId "com.nho.upscaler"
        minSdk 26
        targetSdk 34
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1
        versionName "1.0." + (project.hasProperty('versionCode') ? project.property('versionCode') : "1")
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixedKey
        }
        release {
            signingConfig signingConfigs.fixedKey
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}